<script>
    // Task 16: Discount Calculator: Store product price and discount 
    // percentage. Calculate discount amount and final payable amount.
    let product_price = 2000;
    let discount_percentage = 15;

    let discount_amount = product_price * discount_percentage / 100;
    let final_amount = product_price - discount_amount;

    console.log("Product Price: ₹" + product_price);
    console.log("Discount Percentage: " + discount_percentage + "%");
    console.log("Discount Amount: ₹" + discount_amount);
    console.log("Final Payable Amount: ₹" + final_amount);
</script>
