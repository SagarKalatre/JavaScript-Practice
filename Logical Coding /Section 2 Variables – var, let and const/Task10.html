<script>
    // Task 10: Employee Salary: Store employee basic salary using let. Calculate HRA (20%), DA (10%), and total salary.

    let basic_salary = 30000;

    let HRA = basic_salary * 20 / 100;
    let DA = basic_salary * 10 / 100;

    let total_salary = basic_salary + HRA + DA;

    console.log("Basic Salary: " + basic_salary);
    console.log("HRA (20%): " + HRA);
    console.log("DA (10%): " + DA);
    console.log("Total Salary: " + total_salary);
</script>
