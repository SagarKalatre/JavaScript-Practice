    <title>9. Digital Countdown</title>
</head>
<script>
    // 9. Digital Countdown: Display numbers from 10 to 1 with a delay of one second between each number. Display
    // “Happy New Year” after the countdown.
    
    let countdown = 10;
    function NewYearCountDown() {
        console.log(countdown);
        countdown--;

        if (countdown == 0) {
            clearInterval(timer);
            console.log("Happy New Year")
        }
    }
    let timer = setInterval(NewYearCountDown, 1000);

</script>
