<script>
    // Task 13: Student Result: Store marks of five subjects using separate variables. Calculate total marks and percentage
    let subject1 = 85;
    let subject2 = 78;
    let subject3 = 90;
    let subject4 = 88;
    let subject5 = 79;

    let total_marks = subject1 + subject2 + subject3 + subject4 + subject5;
    let percentage = (total_marks / 500) * 100;

    console.log("Total Marks: " + total_marks);
    console.log("Percentage: " + percentage + "%");
