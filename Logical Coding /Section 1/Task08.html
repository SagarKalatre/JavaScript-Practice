<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 08</title>
</head>
<body>
    <!-- Task 8: Student Registration Form: Create a registration form using HTML and external JavaScript. Use the onsubmit
    event to display the entered student name and email. -->
    <h2>Task 8: Student Registration Form</h2>

    <form onsubmit="registerStudent(event)">
        <label>Student Name:</label>
        <input type="text" id="studentName" required>
        <br><br>
        <label>Student Email:</label>
        <input type="email" id="studentEmail" required>
        <br><br>
        <button type="submit">Register</button>

    </form>

    <h3 id="registrationResult"></h3>

    <script src="Task08.js"></script>

</body>
</html>
