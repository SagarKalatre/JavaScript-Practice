<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- Task 5: Keyboard Event: Create an input field that displays an alert when the user presses a key using onkeydown. -->
    <div>
        <h2>Task 5: Keyboard Event</h2>

        <input type="text"
               placeholder="Press any key"
               onkeydown="alert('You pressed a key!')">
    </div>
</body>
</html>
