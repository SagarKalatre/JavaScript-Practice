<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<script>
    // Task 23: Dynamic Typing: Create a variable using let. Initially assign a number, then a string, and finally a boolean.
    // Display the value and type after every update.

    let value = 100;

    console.log("Value : " + value);
    console.log("Type : " + typeof value);

    value = "Sagar";

    console.log("Value : " + value);
    console.log("Type : " + typeof value);

    value = true;

    console.log("Value : " + value);
    console.log("Type : " + typeof value);

</script>

</body>
</html>
