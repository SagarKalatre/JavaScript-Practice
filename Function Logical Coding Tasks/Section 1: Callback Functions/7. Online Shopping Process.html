<script>
    // 7. Online Shopping Process: Create functions for AddToCart(), PlaceOrder(), MakePayment() and
    // GenerateInvoice(). Execute all operations using callback functions.

    function AddToCart(callback) {
        console.log("Add to cart successfully");
        callback();
    }

    function PlaceOrder(callback) {
        console.log("Add to cart successfully");
        callback();
    }

    function MakePayment(callback) {
        console.log("Add to cart successfully");
        callback();
    }

    function GenerateInvoice() {
        console.log("Invoice Generate Successfully")
    }

    AddToCart(function() {
        PlaceOrder(function() {
            MakePayment(function() {
                GenerateInvoice();
            });
        });
    });
</script>
