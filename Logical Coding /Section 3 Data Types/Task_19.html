<script>
    // Task 19: Primitive Data Types: Create two variables with the same primitive value. Update one variable and verify
    // whether the second variable changes.
    
    let num1 = 100;
    let num2 = num1;

    console.log("Before Updating:");
    console.log("Num1 : " + num1);
    console.log("Num2 : " + num2);

    num1 = 500;

    console.log("After Updating:");
    console.log("Num1 : " + num1);
    console.log("Num2 : " + num2);

</script>
