<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- Task 4: Mouse Leave Effect: Create a paragraph that changes its background color when the mouse leaves it using onmouseout. -->
    <div class="container">
        <h2>Task 4: Mouse Leave Effect</h2>

        <p id="mouseParagraph"
           onmouseout="this.style.backgroundColor='lightgreen'">
            Move your mouse over this paragraph and then move it away.
        </p>
    </div>
</body>
</html>
