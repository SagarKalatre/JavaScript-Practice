<script>
    // Task 24: Array and Object Comparison: Create an array and an object containing student information. Display their
    // types and compare their structures.
    let student_array = ["Sagar", 101, 22, 85];

    let student_object = {
        name: "Sagar",
        roll_number: 101,
        age: 22,
        marks: 85
    };

    console.log("Student Array : " + student_array);
    console.log("Array Type : " + typeof student_array);

    console.log("Student Object : ", student_object);
    console.log("Object Type : " + typeof student_object);

    console.log("Array First Value : " + student_array[0]);
    console.log("Object Student Name : " + student_object.name);

</script>
