<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- Task 3: Mouse Hover Effect: Create a heading that changes its text when the mouse moves over it using onmouseover. -->
    <div class="container">
        <h2>Task 3: Mouse Hover Effect</h2>

        <h3 id="hoverHeading"
            onmouseover="this.innerHTML='Mouse is Over the Heading!'">
            Move Mouse Over This Heading
        </h3>
    </div>
</body>
</html>
