    <!-- Task 6: Internal JavaScript Calculator: Create two input fields and an Addition button. Write JavaScript inside the HTML

    <div class="container">
        <h2>Task 6: Internal JavaScript Calculator</h2>

        <input type="number" id="num1" placeholder="Enter First Number">
        
        <input type="number" id="num2" placeholder="Enter Second Number">

        <button onclick="addition()">Addition</button>
        <button onclick="substraction()">Substraction</button>
        <button onclick="multiplation()">Multiplation</button>
        <button onclick="division()">Division</button>

        <h3 id="Result">Result: </h3>
    </div>
