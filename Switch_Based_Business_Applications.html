        // Task 16. Railway Coach Selection: Accept coach type (SL, 3AC, 2AC, 1AC) and passenger category. Calculate the
        // final ticket price using switch and conditional statements.
        let coach_type = "SL";
        let passenger_category = "Male";
        let base_price = 0;
        let discount = 0;
        let final_price = 0;

        switch (coach_type) {
            case "SL":
                base_price = 500; 
                break;
            
            case "3AC":
                base_price = 1000; 
                break;

            case "2AC":
                base_price = 1500;
                break;

            case "1AC":
                base_price = 2000;
                break;

            default:
                console.log("Invalid Coach Type");
        }

        if (coach_type == "SL" || coach_type == "3AC" || coach_type == "2AC" || coach_type == "1AC" ) {
            if (passenger_category == "Male") {
                discount = 0;
            } else if (passenger_category == "Female") {
                discount = 10;
            } else if (passenger_category == "Senior Citizen") {
                discount = 20;
            } else if (passenger_category == "Child") {
                discount = 50;
            } else {
                console.log("Invalid Passenger Category");
            }

            if (passenger_category == "Male" || passenger_category == "Female" || passenger_category == "Senior Citizen" || passenger_category == "Child") {
                final_price = base_price - (base_price * discount / 100);
                console.log("Coach Type : " + coach_type);
                console.log("Base Price : " + base_price)
                console.log("Passenger Category : " + passenger_category)
                console.log("Discount : " + discount)
                console.log("Final Ticket Price : " + final_price)
            }
        }
