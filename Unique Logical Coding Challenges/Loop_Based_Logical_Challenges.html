        // Task 26. Continuous Sensor Monitoring: Accept temperature readings repeatedly. Stop monitoring when temperature

        let temp_readings = [30, 45, 60, 75, 100, 105];

        while (i < temp_readings.length) {
            let temperature = temp_readings[i];

            }
            i++;

        // Task 27. Consecutive Failed Login Detection: Accept login results repeatedly. Lock the account after three
        // consecutive failed attempts. A successful login resets the consecutive failure count.
        let login_result = ["Failed", "Failed", "Success", "Failed", "Failed", "Failed"];
        let j = 0;
        let failed_attempts = 0;
        while (j < login_result.length) {
            let login = login_result[j]
            console.log("Login Result : " + login)

            if (login == "Failed") {
                failed_attempts++;
            } else if (login == "Success") {
                failed_attempts = 0;
            } 

            if (failed_attempts == 3) {
                console.log("Account Locked..!")
                break;
            }
            j++;
        }

        
        // Task 28. Sales Target Monitoring: Accept daily sales figures until the monthly target is achieved. Display the number
        // of days required to reach the target.
        let monthly_target = 50000;
        let daily_sales = [10000, 1200, 8000, 1500, 10000, 2000, 10000, 5600, 1700];

        let total_sales = 0;
        let days = 0;
        let k = 0;
        while (total_sales < monthly_target && k < daily_sales.length) {
            total_sales += daily_sales[k];
            days++;

            console.log("Day " + days + " Sales: " + daily_sales[k]);
            k++;
        }
        if (total_sales >= monthly_target) {
            console.log("Monthly Target Achieved!");
            console.log("Total Sales: " + total_sales);
            console.log("Days Required: " + days);
        } else {
            console.log("Monthly Target Not Achieved!");
        }

        
        
        // Task 29. Customer Feedback Analysis: Accept customer ratings from 1 to 5 until the user enters 0. Count positive,
        // neutral, and negative ratings.
        let ratings = [5, 4, 2, 3, 1, 5, 0];

        let positive = 0;
        let neutral = 0;
        let negative = 0;
        let l = 0;

        while (l < ratings.length) {
            let rating = ratings[l];
            if (rating == 0) {
                break;
            }
            if (rating >= 4 && rating <= 5) {
                positive++;
            } else if (rating <= 3) {
                neutral++;
            } else if (rating >= 1 && rating <= 2) {
                negative++;
            } else {
                console.log("Invalid Rating....!")
            }
            l++;
        }
        console.log("Positive Rating : " + positive);
        console.log("Neutral  Rating : " + neutral);
        console.log("Negative Rating : " + negative);
        
        // Task 30. Inventory Replenishment: Accept product sales quantities repeatedly. Reduce stock after every sale and stop
        // accepting sales when stock becomes zero.
        let stock = 20;
        let sales = [5, 8, 4, 3, 2];

        let m = 0;
        console.log("Invalid Stock...!")
        while (stock > 0 && m < sales.length) {
            let sale_quantity = sales[m];
            if (sale_quantity > stock) {
                console.log("Insufficient Stock!");
                break;
            }

            stock = stock - sale_quantity;

            console.log("Sale Quantity: " + sale_quantity);
            console.log("Remaining Stock: " + stock);

            m++;
        }

        if (stock == 0) {
            console.log("Stock Empty! Sales Stopped.");
        }

        // Task 32. Employee Salary Processing: Process salaries for multiple employees. Calculate gross salary, deductions,
        // and net salary. Stop when the employee ID entered is 0.
        // Task 32. Employee Salary Processing

        let employee_ids = [101, 102, 103, 104, 0];
        let basic_salaries = [20000, 25000, 30000, 18000];

        let n = 0;

        while (n < employee_ids.length) {

            let employee_id = employee_ids[n];

            if (employee_id == 0) {
                console.log("Salary Processing Stopped!");
                break;
            }

            let basic_salary = basic_salaries[n];

            let hra = basic_salary * 0.20;
            let da = basic_salary * 0.10;
            let pf = basic_salary * 0.12;

            let gross_salary = basic_salary + hra + da;
            let deductions = pf;
            let net_salary = gross_salary - deductions;

            console.log("-----------------------");
            console.log("Employee ID: " + employee_id);
            console.log("Basic Salary: " + basic_salary);
            console.log("Gross Salary: " + gross_salary);
            console.log("Deductions: " + deductions);
            console.log("Net Salary: " + net_salary);

            n++;
        }
