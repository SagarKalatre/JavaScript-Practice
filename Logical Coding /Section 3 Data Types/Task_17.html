<!DOCTYPE html>

<script>
    // Task 17: Data Type Identifier: Create variables containing number, string, boolean, undefined, null, symbol, and BigInt
    // values. Display their types using typeof.
    let num = 101;
    let str = "Sagar";
    let bool = true;
    let und;
    let nul = null;
    let sym = Symbol("ID");
    let big = 12345678901234567890n;

    console.log("Number : " + typeof num);
    console.log("String : " + typeof str);
    console.log("Boolean : " + typeof bool);
    console.log("Undefined : " + typeof und);
    console.log("Null : " + typeof nul);
    console.log("Symbol : " + typeof sym);
    console.log("BigInt : " + typeof big);
    
</script>

</body>
