    <title>Task 14</title>

<script>
    // Task 14: Rectangle Calculator: Store length and width using let. Calculate 
    // area and perimeter. Update the dimensions and calculate again.
    let length = 10;
    let width = 5;

    let area = length * width;
    let perimeter = 2 * (length + width);

    console.log("Original Area: " + area);
    console.log("Original Perimeter: " + perimeter);

    // Updating dimensions
    length = 20;
    width = 8;

    area = length * width;
    perimeter = 2 * (length + width);

    console.log("Updated Area: " + area);
    console.log("Updated Perimeter: " + perimeter);
</script>

</body>
