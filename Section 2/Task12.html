<script>
    // Task 12: Variable Updating: Create three variables using var, let, and const. Update the values of var and let.
    // Observe what happens when you try to update const.
    // Task 12: Variable Updating

    var employee_id = 101;
    let employee_name = "Rahul";
    const company_name = "TCS";

    // Updating var and let
    employee_id = 102;
    employee_name = "Sagar";

    // Trying to update const
    // company_name = "Infosys"; // This causes a TypeError

    console.log("Employee ID: " + employee_id);
    console.log("Employee Name: " + employee_name);
    console.log("Company Name: " + company_name);
</script>
