    <title>Student Registration System</title>

<script>
    // 1. Student Registration System: Create a function RegisterStudent() that accepts a student name and a
    // callback. After registration, execute the callback to display “Student registered successfully”.
    function RegisterStudent(stud_name, callback) {
        console.log("Student Name : " + stud_name)
        callback();
    }

    function displayMessage() {
        console.log("Student registered successfully")
    }

    RegisterStudent("Sagar", displayMessage)
    
</script>
