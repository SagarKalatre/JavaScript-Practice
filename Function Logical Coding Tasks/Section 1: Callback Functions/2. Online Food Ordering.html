<script>
    // 2. Online Food Ordering: Create a function PlaceOrder() that accepts an order ID and a callback. After placing
    // the order, call another function to display “Order confirmed”.
    function PlaceOrder(order_id, callback) {
        console.log("Order Id : " + order_id);
        callback();
    }

    function displayOrder() {
        console.log("Order Confirmed")
    }
    PlaceOrder(12, displayOrder)
</script>
