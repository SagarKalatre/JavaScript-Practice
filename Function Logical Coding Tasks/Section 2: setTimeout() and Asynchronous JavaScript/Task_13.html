    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>13. Automatic Logout</title>
</head>
<script>
    // 13. Automatic Logout: Create a login simulation. If the user does not perform any activity for 10 seconds, display
    // “Session Expired”.
    function Login() {
        console.log("User Logged In")

        setTimeout(function() {
            console.log("Session Expired")
        }, 10000)
    }

    Login();
</script>
